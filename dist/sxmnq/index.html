可控范围内。'},{版面:'要闻',标题:'凛冬特区地下供暖管网延长运行两周',正文:'极北穹顶区的供暖管网将比往年多运行两周。特区管理局表示这是应居民代表的要求，代价是多烧掉一批储备燃料。'},{版面:'要闻',标题:'浮岛航路改道，东侧三条主航线绕开新生成的暗礁带',正文:'航运公会昨日发布通告，东侧三条主航线即日起改道，绕开一片新生成的暗礁带。改道后单程多出约半天航时，运价暂不上调。'},{版面:'要闻',标题:'森海向导素提炼基地本季减产，白塔启动调配',正文:'受长雨季影响，极南三处提炼基地的本季产量比预期低了一成半。白塔已启动跨区调配，优先保证治疗中心与深渊随队向导的用量。'},{版面:'要闻',标题:'狂沙新矿脉勘探进入详查阶段',正文:'极西新发现的矿脉已完成初步勘探。样本显示稀有矿石品位高于现有主力矿区，但埋深更大，开采成本还要再算。'},{版面:'要闻',标题:'白塔任务大厅调整任务投放结构，D 级任务占比上调',正文:'任务大厅本季把 D 级任务占比上调至三成。负责人称这是为了给新毕业的哨兵留出足够的实战积累窗口，同时压一压高级任务的抢单。'},{版面:'要闻',标题:'冻结区外围发现无主精神体残迹，调查组已进驻',正文:'巡逻队在冻结区外围发现一具无主精神体残迹。残迹保留完整，没有对应的哨兵记录。调查组已进驻，初步判断与失踪多年的旧编制有关。'},{版面:'要闻',标题:'跨区客运恢复常态化，检疫环节从三道减为一道',正文:'四大特区之间的客运班次恢复到常年水平。随车检疫从三道减为一道，但旅客仍须随身携带抑制器登记卡。'},{版面:'要闻',标题:'治疗中心床位周转率创三年新低',正文:'白塔治疗中心上月的床位周转率降到三年来的最低点。中心方面把它归因于中重度污染病例的占比上升 —— 同样的治疗次数，清不干净的人变多了。'},{版面:'要闻',标题:'深渊 T2 层清理任务完成，队伍无人伤亡',正文:'持续十一天的 T2 层清理任务昨日收尾。参战的四支小队全部返回，无人伤亡，但有两名哨兵因感官过载接受了为期一周的强制休整。'},{版面:'要闻',标题:'四大特区就向导素出口配额达成临时协议',正文:'四区代表在浮岛签署临时协议，把向导素的跨区出口配额与提炼量挂钩。协议有效期一年，到期自动续签，除非有一方提前六十天提出异议。'},{版面:'要闻',标题:'白塔拟在极东增设第二处抑制器维护站',正文:'由于浮岛往来人员长期排队，白塔拟在极东增设第二处维护站。选址在两座人工岛之间的连接桥上，预计一年后投入使用。'},{版面:'要闻',标题:'寒潮预警：凛冬全境进入极光活跃期',季:['冬'],正文:'极光带连续三夜覆盖极北全境。特区管理局提醒，极光活跃通常伴随磁场波动与轻微污染潮，夜间巡逻编队已加密。'},{版面:'要闻',标题:'破冰节筹备启动，凛冬港区开始铺设冰面栈道',季:['冬'],正文:'今年的破冰节仍在极北起源地举行。港区已开始铺设冰面栈道，气象组预计届时的气温会比常年更低一些。'},{版面:'要闻',标题:'初雪日观测工作就绪，各区将同步记录首雪时刻',季:['冬'],正文:'初雪日临近，四个特区将第一次同步记录各地的首雪时刻。这项观测由森海的研究所提出，目的是比对不同纬度的降温节奏。'},{版面:'要闻',标题:'长夜安眠临近，白塔调整各区休整排班',季:['冬'],正文:'岁末的休整期临近，白塔开始调整各区的排班表。任务大厅将在此期间只保留应急窗口，深渊方向的常规任务全部顺延。'},{版面:'要闻',标题:'落叶祭悼念仪式在四区同日举行',季:['秋'],正文:'落叶祭的悼念仪式在四个特区同日举行。今年的主题是疗愈，白塔派出向导团队在各地提供免费的精神安抚。'},{版面:'要闻',标题:'秋狩献礼收官，本季任务总结将于下周公布',季:['秋'],正文:'秋狩献礼进入收官阶段。任务大厅将在下周公布本季的任务总结，包括各区的完成率与深层任务的伤亡统计。'},{版面:'要闻',标题:'伴生竞技周报名截止，参赛对子数创纪录',季:['夏'],正文:'伴生竞技周的报名昨日截止。今年的参赛对子比上届多出近四成，其中首次出现了来自极西的独行哨兵临时组队。'},{版面:'要闻',标题:'森海荧光节开幕，生态展示区延长夜间开放',季:['夏'],正文:'森海荧光节在极南开幕。生态展示区把夜间开放时间延长了两个小时，据说是为了让更多人看到萤光蕨的盛放期。'},{版面:'要闻',标题:'花朝节临近，白塔各区开始布置',季:['春'],正文:'花朝节临近，白塔各区已开始布置。这是唯一一个专属白塔的节日，讲究的是把住处收拾出一点春天的样子。'},{版面:'要闻',标题:'风息日期间全域停止实弹演练',季:['春'],正文:'风息日的三天里，全域停止实弹演练与深渊投放。这一传统源自极西，最初是停战，后来慢慢变成了一整片区域的静默。'},{版面:'要闻',标题:'春泉祭开启，极东开始本年度的水源净化',季:['春'],正文:'春泉祭开启，极东的浮岛开始本年度的水源净化。净化期间部分岛屿会短时停水，航运公会已提前通知了常驻商户。'},{版面:'要闻',标题:'建塔日纪念活动将在中央区举行',季:['春'],正文:'建塔日的纪念活动仍将在中央区举行。今年的安排比往年简单，只保留了献花与点名两个环节。'},{版面:'要闻',标题:'新星入塔名单公示，本届毕业生人数低于往年',季:['夏'],正文:'新星入塔的名单开始公示。本届毕业生人数低于往年，其中向导的比例创下近五年新高。'},{版面:'要闻',标题:'夏夜星芒观测条件良好，中央区开放顶层平台',季:['夏'],正文:'夏夜星芒的两天里，中央区将开放顶层平台供人观星。天文组提醒，极北方向的极光带今年偏弱，不会干扰观测。'},{版面:'要闻',标题:'沙暴预警：狂沙全境能见度不足百米',季:['春'],天:['沙','尘','风'],正文:'狂沙特区全境遭遇沙暴，能见度一度不足百米。地面运输全部停摆，矿区的轮班改为就地避险。'},{版面:'要闻',标题:'持续强降雪压塌凛冬两处穹顶，无人员伤亡',季:['冬'],天:['雪'],正文:'连日强降雪压塌了凛冬区两处旧穹顶。两处都已在去年列入翻修名单，事发时无人值守。'},{版面:'要闻',标题:'暴雨导致森海三座悬索桥临时封闭',季:['夏'],天:['雨'],正文:'持续暴雨导致极南三座悬索桥临时封闭。研究所在桥头设置了接驳点，把往来人员改道到树屋栈道上。'},{版面:'社会',标题:'凛冬的散步习惯又一次被外地人写进了游记',正文:'一位浮岛来的作者在游记里写道：极北人无论清晨、正午还是深夜都在街上走，「没人说得清为什么」。本地读者表示，这话每年都要被说一遍。'},{版面:'社会',标题:'狂沙哨兵替人化妆的手艺，终于被本人承认了',正文:'极西一项传承已久的追爱手段近日首次被公开讨论。多名出身狂沙的哨兵承认会替心仪对象化妆，但坚称「不会当面说这是为什么」。'},{版面:'社会',标题:'雨季不出的森海哨兵，把这个习惯过成了室内园艺',正文:'长雨季里极南的哨兵很少出门。一位受访者说，他们通常拿这段时间装点住处、养育植物，「反正雨停之前什么也做不了」。'},{版面:'社会',标题:'浮岛的赠与文化让快递员很为难',正文:'极东人习惯用赠东西表达「想跟对方待在一起」，这项传统最近让新来的物流从业者颇为困扰 —— 收件人坚持要回赠点什么，否则不肯签收。'},{版面:'社会',标题:'白塔宿舍区试行「静音层」，首批入住已满',正文:'觉醒者宿舍区划出两层试行静音层，禁止在走廊内进行精神体日常放养。首批名额在开放当天就报满，排队名单已排到下一季度。'},{版面:'社会',标题:'训练场新增感官过载模拟室，首月免费',正文:'白塔训练场新增一间感官过载模拟室，可在受控条件下复现轻度过载。首月免费向持证哨兵开放，需提前一日预约。'},{版面:'社会',标题:'商业区出现专供精神体的零食摊',正文:'白塔商业区出现一个专供精神体的零食摊。摊主称配方是按不同纲属调整的，「冰系的要多点油脂，林地的偏甜」。'},{版面:'社会',标题:'深渊边缘的巡逻队捡到一只走失的精神体',正文:'巡逻队在深渊边缘拾到一只走失的精神体。它没有随行哨兵的痕迹，目前寄养在治疗中心，体征稳定但不进食。'},{版面:'社会',标题:'极东的审美多元到什么程度：街拍栏目拍了三年还没吵完',正文:'浮岛一份持续三年的街拍栏目近日停更。编辑在告别信里说，本来是想争一个「最好看」，拍了三年发现这里根本没有统一答案。'},{版面:'社会',标题:'森海的研究所开放公众日，预约名额半小时内抢空',正文:'极南的研究所今年首次开放公众日，展出向导素提炼的早期设备。预约名额在开放后半小时内被抢空，主办方表示明年会考虑增加场次。'},{版面:'社会',标题:'霜降前后，各区呼吸道门诊量上升',正文:'霜降前后气温骤降，各区的呼吸道门诊量普遍上升。医生提醒，精神体在换季时也会有应激反应，出现拒食不必过度紧张。'},{版面:'社会',标题:'一位向导在浮岛开了家「不说话」的茶馆',正文:'茶馆规矩只有一条：进门之后不必交谈。店主说初衷是给做深度安抚的同行找个能彻底闭嘴的地方，结果来的一半是哨兵。'},{版面:'社会',标题:'深渊 T1 清理队的旧制服被送进了陈列室',正文:'第一批 T1 清理队的旧制服昨日送进白塔陈列室。制服上的风沙涂层已经剥落大半，标签上还留着当年的编号。'},{版面:'社会',标题:'凛冬居民请愿保留一段废弃供暖管，理由是想听它响',正文:'极北一段废弃供暖管原定本月拆除。附近居民联名请愿保留，理由是冬天里那个声音「听了几十年，没有了会觉得少点什么」。'},{版面:'社会',标题:'塔外体检车开进狂沙偏远矿区',正文:'白塔的移动体检车本月开进极西的偏远矿区。相比返塔，就地体检为长期驻矿的哨兵省下了近两周的往返时间。'},{版面:'社会',标题:'森海的树屋区开始试行「不许砍树」的新规',正文:'极南树屋区开始试行新规：扩建住处一律不得砍伐原生巨树。住在三层的居民抱怨采光变差，但同意「总比住着住着树没了强」。'},{版面:'社会',标题:'浮岛的一位老人坚持给每艘离港的船挥手',正文:'极东码头有位老人，据说已经给每一艘离港的船挥了二十年手。被问及原因时他说：「他们要走很远。」'},{版面:'社会',标题:'商业区的修表摊兼修抑制器，被白塔叫停',正文:'白塔商业区一处修表摊因私自拆解抑制器被叫停。摊主称只是「换个表带」，但维护站表示抑制器的外壳一旦拆开就必须重做校准。'},{版面:'社会',标题:'训练场外的小猫精神体成了编外吉祥物',正文:'一只常在训练场外徘徊的小型精神体成了编外吉祥物。它没有登记，也没人认领，但已经有哨兵自发给它搭了窝。'},{版面:'社会',标题:'狂沙的护眼液配方被做成了伴手礼',正文:'极西矿区用矿石粉与草药调制的护眼液，最近被包装成伴手礼出售。老矿工评价：装得是比以前好看，但凉得没以前久。'},{版面:'社会',标题:'一场持续两天的争吵：浮岛的霓虹是不是开得太亮了',正文:'浮岛几处新增的霓虹招牌引发争执。反对者说夜里亮得睡不着，支持者说「来极东不就是为了看点亮的」。市政暂未表态。'},{版面:'社会',标题:'治疗中心引入「安静时段」，探视时间缩短',正文:'治疗中心本月起设置每日两小时的安静时段，期间停止一切探视。中心方面表示，这是为了给深度安抚留出不受打扰的窗口。'},{版面:'社会',标题:'觉醒者学校的毕业照开始允许带精神体入镜',正文:'今年的毕业照首次允许精神体入镜。摄影师说场面一度非常混乱，「一只冰系的往镜头前面一站，后面全白了」。'},{版面:'社会',标题:'森海的雨季长到什么程度：本地的伞是拿来晾的',正文:'极南的雨季比任何一个地方都要长。本地人说伞基本不随身带，「反正出门就湿，不如回家晾」。'},{版面:'社会',标题:'大雾天里，浮岛的渡轮改成了鸣笛对航',天:['雾'],正文:'连日的浓雾让浮岛渡轮改成了低速鸣笛对航。航运公会称这是常规手段，去年同一时期也用过。'},{版面:'社会',标题:'初雪落下时，中央区的广场上站满了人',季:['冬'],天:['雪'],正文:'今年的初雪比往年早了两天。消息传开之后，中央区的广场上很快站满了人，多数人只是站着，没做什么。'},{版面:'社会',标题:'雨季里的树屋区，晾不干的衣服成了公共话题',季:['夏'],天:['雨'],正文:'持续降雨让树屋区的住户为晾衣服发愁。有人提议在悬索桥下架设公共烘干房，方案已经交到了区务处。'},{版面:'经济',标题:'抑制器维护站排期积压，预约已排到三周后',正文:'白塔抑制器维护站出现排期积压，常规校准的预约已排到三周之后。维护站建议非紧急需求避开本月的高峰时段。'},{版面:'经济',标题:'向导素跨区报价上涨，森海方面称与减产无关',正文:'向导素的跨区报价本周上涨。极南方面表示价格波动来自运输环节，与提炼基地的减产没有直接关系。'},{版面:'经济',标题:'狂沙矿石运价翻倍，矿区考虑自建短驳线路',正文:'极西矿石的陆运费率本月翻倍。几家矿区正在商议自建一条短驳线路，把矿料直接送到区界的转运点。'},{版面:'经济',标题:'浮岛仓储租金连续第三季上涨',正文:'浮岛的仓储租金连续第三个季度上涨，靠近主航道的仓位涨幅最大。中小商户开始把库存挪到外环的几个小岛。'},{版面:'经济',标题:'凛冬军备订单增加，重工厂区开始三班倒',正文:'极北的重工厂区本月起实行三班倒。特区方面没有公布订单的具体来源，只表示「与边境的部署调整有关」。'},{版面:'经济',标题:'白塔商业区铺位空置率下降，餐饮类占比上升',正文:'商业区的铺位空置率降到两年来的最低点，其中新开的餐饮类占比接近一半。管理方称这是宿舍区扩容带来的连带效应。'},{版面:'经济',标题:'治疗中心的耗材采购价上调，诊金标准暂不变动',正文:'治疗中心的耗材采购价本月上调。中心方面确认，对外的诊金标准暂时不会跟着变，差额由中心的预算消化。'},{版面:'经济',标题:'狂沙与凛冬签署直供协议，绕过第三方转运',正文:'极西与极北签署了一份矿石直供协议，运输不再经过第三方的转运仓。分析人士认为，这会让两区的结算周期缩短近一半。'},{版面:'经济',标题:'森海农业区的本季收成高于预期',正文:'极南农业区的本季收成高于预期。研究所在其中试种的一批耐阴作物表现尤其好，明年可能扩大种植面积。'},{版面:'经济',标题:'深渊任务赏金上调，深层任务涨幅最大',正文:'任务大厅上调了深渊方向的赏金标准，T3 及以下的任务涨幅最大。大厅方面称，这与近期的空间褶皱需要更高级别的随队向导有关。'},{版面:'经济',标题:'浮岛情报市场出现新规，买卖双方须留痕',正文:'浮岛的情报交易本月起执行新规，买卖双方都须留下记录。公会表示这是为了减少「一份情报卖三家」的纠纷。'},{版面:'经济',标题:'抑制器核心部件国产化率提升，进口依赖下降',正文:'抑制器的核心部件国产化率本季进一步提升。维护站表示，这会让校准的等待时间在明年有所改善。'},{版面:'经济',标题:'黑市向导素流向被截，涉案金额未公布',正文:'执法部门在极南暗雨街区截获一批来路不明的向导素。涉案人员已被控制，金额与流向暂未公布。'},{版面:'经济',标题:'毒蛇帮疑似介入废料回收，斗兽场周边警戒加强',正文:'有消息称毒蛇帮开始介入深渊周边的废料回收。矿区在斗兽场一带加强了警戒，暂未发生冲突。'},{版面:'经济',标题:'凛冬的边境哨站增编，后勤压力随之上升',正文:'极北的边境哨站本月增编。新增人员的后勤补给让特区的运输部门压力上升，部分线路已经排到了下个月。'},{版面:'经济',标题:'伴生竞技周的转播权卖出高价',正文:'今年的伴生竞技周转播权卖出了历届最高价。买方是浮岛的一家新成立的传播机构，据称将采用全新的跟拍方式。',季:['夏']},{版面:'经济',标题:'秋狩献礼带动的装备订单已排至年末',正文:'秋狩献礼带动的装备订单已经排到年末。几家作坊表示，今年订得最多的是适合单人携带的轻量化护具。',季:['秋']},{版面:'讣告',标题:'讣告：原极北第三清理队队长 韩彻',正文:'韩彻, 原极北第三清理队队长, 于深渊 T3 层执行任务时因感官过载殉职, 享年四十一岁。他曾带队完成 T2 层主要通道的十年清障。'},{版面:'讣告',标题:'讣告：向导 沈知白',正文:'沈知白, 向导, 在随队执行深层任务时为维持屏障耗尽精神力, 抢救无效去世, 享年三十三岁。他生前累计随队进入 T3 层四十七次。'},{版面:'讣告',标题:'讣告：森海向导素提炼师 岑茂',正文:'岑茂, 极南向导素提炼师, 因病去世, 享年六十七岁。他主持改良的低温提炼法沿用至今。'},{版面:'讣告',标题:'讣告：浮岛航运调度员 韦长庚',正文:'韦长庚, 极东航运调度员, 在暗礁带改道期间连续值守十二日后突发急症去世, 享年五十八岁。改道方案由他最后定稿。'},{版面:'讣告',标题:'讣告：狂沙矿石分析员 铁木',正文:'铁木, 极西矿石分析员, 在矿区塌方事故中遇难, 享年三十六岁。他参与编订的矿样分类表仍在使用。'},{版面:'讣告',标题:'讣告：白塔训练场教官 祁戎',正文:'祁戎, 白塔训练场教官, 因病去世, 享年六十二岁。他从教三十一年, 带过的哨兵遍布四个特区。'},{版面:'讣告',标题:'讣告：原深渊勘测队员 桑吉',正文:'桑吉, 原深渊勘测队员, 于早年 T4 层任务中失踪, 近日经确认为殉职, 享年二十九岁。他留下的 T2 层手绘图仍是现行勘测底图之一。'},{版面:'讣告',标题:'讣告：治疗中心护理长 安娜',正文:'安娜, 白塔治疗中心护理长, 于值班期间突发疾病去世, 享年五十四岁。她在治疗中心工作了二十八年。'},{版面:'讣告',标题:'讣告：向导 陆听澜',正文:'陆听澜, 向导, 在一次边境支援中遭遇污染潮, 抢救无效去世, 享年三十七岁。她生前坚持为每一位出院者写一张回访卡。'},{版面:'讣告',标题:'讣告：凛冬穹顶结构师 郝明川',正文:'郝明川, 极北穹顶结构师, 因病去世, 享年七十一岁。他设计的第三代穹顶扛住了近十年的最强暴雪。'},{版面:'讣告',标题:'讣告：浮岛灯塔值守员 老周',正文:'老周, 极东灯塔值守员, 在岗位上安然离世, 享年七十九岁。他在同一座灯塔上守了四十一年, 从未漏掉一次点灯。'},{版面:'讣告',标题:'讣告：原极西佣兵团成员 阿勒',正文:'阿勒, 原极西佣兵团成员, 于清剿任务中阵亡, 享年三十四岁。他所在的团在三年内完成了十七次沙暴中的护送。'},{版面:'讣告',标题:'讣告：森海生态观测员 白鹭',正文:'白鹭, 极南生态观测员, 在雨季观测途中失足坠桥, 抢救无效去世, 享年三十二岁。她记录的那片萤光蕨今年开得最好。'},{版面:'讣告',标题:'讣告：白塔抑制器维护师 邵平',正文:'邵平, 白塔抑制器维护师, 因病去世, 享年六十四岁。经他校准的抑制器超过两万件, 返修率长期是站里最低的。'},{版面:'讣告',标题:'讣告：极北巡逻队员 图门',正文:'图门, 极北巡逻队员, 在极光活跃期的夜巡中殉职, 享年二十六岁。他的搭档精神体已由队里登记收容。'},{版面:'讣告',标题:'讣告：向导 何砚秋',正文:'何砚秋, 向导, 在深度安抚中遭遇反噬, 抢救无效去世, 享年四十五岁。她生前主张「能不进图景就不进图景」, 这句话现在被写进了教案。'},{版面:'广告',标题:'转让：二手恒温箱一台，八成新',正文:'因扩店转让恒温箱一台，八成新，温度稳定。价格面议，可代为搬运。'},{版面:'广告',标题:'寻物：一枚黄铜挂坠，链子断了',正文:'本月上旬在中央区广场一带遗失黄铜挂坠一枚，链子已断。不值钱，但为长辈所赠。归还必有重谢。'},{版面:'广告',标题:'招工：浮岛仓库夜班理货，包住',正文:'浮岛外环仓库招夜班理货若干，包住不包吃。要求能熬夜、不晕船，有精神体者谢绝（仓位紧张）。'},{版面:'广告',标题:'出租：凛冬穹顶区单间，近供暖主管',正文:'极北穹顶区单间出租，近供暖主管，冬天不冷。押一付三，长租可谈。'},{版面:'广告',标题:'求购：旧版抑制器外壳，不限成色',正文:'求购旧版抑制器外壳，不限成色，只要编号完整。用于教学陈列，价格从优。'},{版面:'广告',标题:'寻人：家精神体走失，冰系，白色',正文:'家精神体于上月在深渊边缘走失，冰系，通体白色，个头不大，怕生。任何线索都请联系，必有酬谢。'},{版面:'广告',标题:'转让：向导素低温保存箱，可改冷藏',正文:'转让向导素低温保存箱一台，容积适中，可改装作普通冷藏使用。使用两年，运转正常。'},{版面:'广告',标题:'开班：感官过载应对课，小班招生',正文:'针对新毕业哨兵的感官过载应对课，小班授课，六人一班。内容以实操为主，不做理论考核。'},{版面:'广告',标题:'招商：森海树屋区临桥铺面',正文:'极南树屋区临桥铺面出租，人流量稳定，适合茶饮、药材、小食。不可用于明火作业。'},{版面:'广告',标题:'收购：废旧抑制器，按件计价',正文:'长期收购报废抑制器，按件计价，上门取件。外壳破损亦可，但内部元件须完整。'},{版面:'广告',标题:'转让：狂沙产护目镜两副，一副未拆封',正文:'转让极西产护目镜两副，一副用过几次，一副未拆封。防沙效果确实好，适合长期在外的人。'},{版面:'广告',标题:'求租：训练场附近短租一个月',正文:'因参加集训，需在训练场附近短租一个月，单间即可，能睡就行。'},{版面:'广告',标题:'代写：讣告与追思文，润笔从优',正文:'代写讣告与追思文。写过多篇，了解各区习惯用语，不动感情，只求写准。'},{版面:'广告',标题:'寻合租：中央区两室，室友须为向导',正文:'中央区两室合租，已有一名哨兵入住。因作息与感知问题，室友仅限向导，无精神体优先。'},{版面:'广告',标题:'出售：手绘深渊 T1 层地图，附注记',正文:'出售深渊 T1 层手绘地图一份，附历年注记。仅为参考，进入前请以任务大厅最新版本为准。'},{版面:'广告',标题:'征友：极北散步同好，任何时段',正文:'征散步同好，清晨、正午、傍晚、深夜都可以，走多走少都行。不用说话，走完各回各家。'},{版面:'广告',标题:'转让：诊疗躺椅一张，皮面有磨损',正文:'转让诊疗躺椅一张，皮面有磨损，功能完好。因换了新的，旧的放着占地方。'},{版面:'广告',标题:'招学徒：修表兼修小型器械',正文:'招收学徒一名，学修表与小型器械。要有耐心，手稳。学成之后自己开店不拦着。'},{版面:'广告',标题:'求购：幼年精神体口粮，冰系',正文:'求购冰系幼年精神体口粮，什么牌子都行，急用。愿意加价。'},{版面:'广告',标题:'转让：浮岛往返季票，剩余两个月',正文:'因调离浮岛，转让往返季票一张，剩余有效期两个月。原价出让，不议价。'},{版面:'广告',标题:'失物招领：拾到抑制器登记卡一张',正文:'在商业区拾到抑制器登记卡一张，姓名已模糊。请失主描述卡面特征后领回。'},{版面:'广告',标题:'搬家：承接各区搬运，精神体可同行',正文:'承接各区搬家搬运，熟悉树屋区与浮岛路线，精神体可同行，不加价。'},{版面:'广告',标题:'出让：长夜安眠期间的休整屋名额',季:['冬'],正文:'因行程变动，出让长夜安眠期间极北休整屋名额一个。位置安静，离供暖主管很近。'},{版面:'广告',标题:'招临时工：雨季树屋栈道维护',季:['夏'],正文:'雨季招栈道维护临时工若干，需能适应
