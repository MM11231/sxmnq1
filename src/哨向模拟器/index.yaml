    # 整条消息换成界面 —— 聊天区从此看不见文字, 剧情由界面自己从原始消息里读出来渲染
    # (见 src/sxmnq/界面/主界面/正文.ts)。
    #
    # 正则没法知道哪条消息是第一楼, 所以每条都会被换成界面; 多出来的那些马上会被
    # 「隐藏楼层」脚本删掉, 界面自己也会在挂载 Vue 之前先退出。
    #
    # 只作用于显示。提示词里必须是原文, 否则 AI 下一轮看不到自己写过什么。
    - 正则名称: '[界面]主界面'
      id: 7c1e5b90-2f4a-4d38-9e61-8a3c5f0d2b74
      启用: true
      查找表达式: /.+/s
      替换为: |-
        ```
        <body>
        <script>
        $('body').load('http://localhost:5501/sxmnq/index.html')
        </script>
        </body>
        ```
      来源:
        用户输入: false
        AI输出: true
      作用于:
