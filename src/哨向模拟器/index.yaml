# yaml-language-server: $schema=https://testingcf.jsdelivr.net/gh/StageDog/tavern_sync/dist/schema/character.zh.json
# 这个配置文件仅作为使用同步脚本的提示. 同步脚本并不是必须使用, 但可以让你的角色卡完全做到自动更新, 具体请参考: https://stagedog.github.io/青空莉/工具经验/实时编写角色卡、世界书或预设/
#
# ⚠ 开发期本地加载: 下面有两处 URL 指向 http://localhost:5501 (本地静态服务器,
#   工作目录就是打包后的 dist/, 所以地址里不带 dist/ 这一段)。原因是要改一行就在
#   酒馆里看到效果, 而 jsDelivr 有 CDN 缓存, 推送后要等很久才生效, 没法迭代。
#   发布前把这两处换回 https://testingcf.jsdelivr.net/gh/MM11231/sxmnq1/dist/
#   (曾经写的是 .../MM11231/bata/ —— 那个仓库名已经没了, jsDelivr 会 404。
#    仓库迁到公开的 sxmnq1 之后这里忘了跟着改, 别照旧值填。)
#     · 正则 [界面]主界面  → .../sxmnq/index.html
#     · 脚本库 变量结构   → .../哨向模拟器/脚本/变量结构/index.js
#
# 前端在 src/sxmnq/ 里, 不在这张卡的目录下 —— 它是个能独立编译成单文件 HTML 的项目,
# 卡这边只留世界书、正则和脚本(见 src/sxmnq/index.ts)。
# 占位图, 真美术图到位后直接覆盖同目录的 头像.png 再 bundle 一次即可。
# 不能留 null: 酒馆的角色列表只认 .png, 没有头像图会退化成"扩展名是 .png 的纯 JSON"。
