  酒馆助手:
    脚本库:
      - 名称: mvu
        id: 22d70d1f-d0be-4061-911e-d0c57ab55053
        启用: true
        类型: 脚本
        内容: |-
          import 'https://testingcf.jsdelivr.net/gh/MagicalAstrogy/MagVarUpdate/artifact/bundle.js';

      - 名称: 变量结构
        id: f65ab164-4268-4366-8228-16af904c2251
        启用: true
        类型: 脚本
        内容: |-
          import 'http://localhost:5501/哨向模拟器/脚本/变量结构/index.js';

      # 脚本 iframe 里的 `$` 就是**酒馆主页面**的 jQuery(酒馆助手在 predefine 里做的
      # `window.$ = window.parent.$`), 所以这里能直接操作主页面的 DOM。
      - 名称: 隐藏楼层
        id: 3f8c2a41-9b7e-4c05-a1d6-2e4f7b8c9a03
        启用: true
        类型: 脚本
        内容: |-
          $(() => {
            // 界面只挂第一楼 —— 那一楼从头到尾都在, 不会被重建, 界面的状态才留得住。
            // 其余楼层也会被正则塞进一个界面, 白建一遍再删掉; 界面自己会在挂载 Vue
            // 之前先退出(见 src/sxmnq/index.ts), 这里只是兜底。
            const 留 = 0;

            function 清楼() {
              $('#chat > .mes').each(function () {
                if (Number($(this).attr('mesid')) !== 留) $(this).remove();
              });
            }

            // 藏掉酒馆自己的楼层外壳, 并把界面**钉**在聊天区上。
            // 用样式表而不是 .hide(): 内联样式压不过 !important, 而且这样一次就够。
            //
            // 只把内边距清零是不够的 —— 试过, 界面会被推出屏幕: 顶栏跑到视口外面, 底部按钮
            // 掉到折叠线以下。两个原因叠在一起:
            //   1. 聊天区自己会滚到底(scrollTop = scrollHeight - clientHeight), 界面被滚上去;
            //   2. 楼层里还留着酒馆自己的内边距, 界面不是从聊天区顶部开始的。
            // 所以这里整条链一路钉死: 聊天区当定位基准, 楼层一路到 iframe 全部铺满它。
            // 谁的内边距都插不进来, 滚也滚不动。
            function 接管外观() {
              $('#th-takeover').remove();
              const 钉满 =
                'position: absolute !important; inset: 0 !important; margin: 0 !important;' +
                ' padding: 0 !important; max-width: none !important;';
              $('<style id="th-takeover">')
                .text(
                  '#chat { position: relative !important; padding: 0 !important; margin: 0 !important;' +
                    ' overflow: hidden !important; }' +
                    `#chat > .mes { ${钉满} height: auto !important; border: none !important;` +
                    ' background: none !important; box-shadow: none !important; }' +
                    '#chat > .mes .mesAvatarWrapper, #chat > .mes .ch_name, #chat > .mes .mes_buttons,' +
                    ' #chat > .mes .mes_timer, #chat > .mes .mes_edit_buttons, #chat > .mes .swipe_left,' +
                    ' #chat > .mes .swipe_right, #chat > .mes .swipeRightBlock, #chat > .mes .swipeLeftBlock' +
                    ' { display: none !important; }' +
                    // TH-render 是酒馆助手包代码块用的壳, 界面 iframe 就生在它里面。
                    `#chat > .mes .mes_block, #chat > .mes .mes_text, #chat > .mes .TH-render { ${钉满} }` +
                    '#chat > .mes iframe { position: absolute !important; inset: 0 !important;' +
                    ' width: 100% !important; height: 100% !important; }',
                )
                .appendTo('head');
            }

            接管外观();
            清楼();

            // 事件和轮询都要: 只靠事件会漏掉流式生成中途冒出来的楼层, 只靠轮询又会让
            // 旧楼层多活半秒、闪一下。
            ['MESSAGE_RECEIVED', 'MESSAGE_SENT', 'MESSAGE_SWIPED', 'MESSAGE_UPDATED', 'MESSAGE_DELETED'].forEach(
              名 => eventOn(tavern_events[名], 清楼),
            );
            setInterval(清楼, 500);

            // ── 自检: 界面挂不上来的时候, 把真正的原因说出来 ──────────────────────
            //
            // 界面只长在第 0 楼, 而酒馆助手的「渲染深度」(扩展 → 酒馆助手 → 渲染 → 渲染深度)
            // 只渲染**离末尾最近**的 N 楼。它给的区间是
            //     range(depth === 0 ? 第一楼的 mesid : max(第一楼的 mesid, 总楼数 - depth), 总楼数)
            // (JS-Slash-Runner: src/store/iframe_runtimes/message.ts 的 calcToRender)
            //
            // 而上面的「清楼」只删 DOM, chat 数组一条没少 —— 所以聊天每多一来回, 第 0 楼
            // 离末尾就远一格; 总楼数一旦超过深度, 它就掉出那个区间: 酒馆助手不再给它建 iframe,
            // 转而把那个代码块折成一颗「显示前端代码块」按钮(use_collapse_code_block.ts)。
            // 界面整个消失, 而且一声不吭 —— 玩家只会看到一团 <body>…</body> 的文本。
            //
            // 所以这里不是「等多久没出来就报」, 而是直接把那一刻的读数算出来: 深度是 0、
            // 或者还没长到会掉出区间的长度时, 一个字都不说, 免得把别的原因(酒馆助手没开、
            // dev 服务器没通)误报成这一条。
            let 报过了 = false; // 同一场故障只报一次, 界面回来之后自动解除
            let 宽限到 = 0; // 第一次算出「它轮不到渲染」的时刻 + 5 秒, 防一手渲染还没跑完

            // 抄 calcToRender 的判据: 下面的「清楼」保证 DOM 第一楼就是第 0 楼,
            // 所以 min_showed_message_id 恒为 0, 第 0 楼轮得到渲染 ⇔ 区间起点 <= 0。
            function 轮得到渲染() {
              const c = SillyTavern.getContext();
              const r = c.extensionSettings?.tavern_helper?.render ?? {};
              const 深 = Number(r.depth ?? 0);
              const 总 = c.chat?.length ?? 0;
              const 可见 = (c.chat ?? []).filter(楼 => !楼.is_system).length;
              if (深 === 0) return true; // 0 = 渲染所有楼层
              return r.depth_ignore_hidden ? 可见 <= 深 : 总 <= 深;
            }

            function 查渲染() {
              const 楼 = $('#chat > .mes[mesid="0"]');
              if (楼.length === 0 || 楼.find('iframe').length > 0) {
                报过了 = false; // 界面回来了, 下次再坏可以再报
                宽限到 = 0;
                return;
              }

              let 说得清 = false;
              try {
                说得清 = !轮得到渲染();
              } catch {
                宽限到 = 0;
                return; // 读不到设置就别猜, 宁可不说
              }
              if (!说得清) {
                宽限到 = 0;
                return;
              }
              if (报过了) return;
              if (宽限到 === 0) {
                宽限到 = Date.now() + 5000;
                return; // 再等五秒, 万一它只是还没渲染完
              }
              if (Date.now() < 宽限到) return;

              报过了 = true;
              const 深 = Number(SillyTavern.getContext().extensionSettings?.tavern_helper?.render?.depth ?? 0);
              const 总 = SillyTavern.getContext().chat?.length ?? 0;
              console.info('[界面] 第 0 楼没被渲染: 渲染深度 ' + 深 + ', 总楼数 ' + 总);
              toastr.error(
                `酒馆助手的「渲染深度」现在是 ${深}，只渲染最近 ${深} 楼；这张卡的界面钉在第 1 楼，` +
                  `而现在已经有 ${总} 楼，所以第 1 楼根本没被渲染。把它改成 0 界面就回来了：` +
                  '扩展 → 酒馆助手 → 渲染 → 渲染深度。',
                '界面没挂上来',
                { timeOut: 0, extendedTimeOut: 0, closeButton: true },
              );
            }

            setInterval(查渲染, 1000);
          });
