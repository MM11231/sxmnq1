---
变量更新规则:
  世界:
    日期:
      format: 「{月}{日}」，如「霜降月第一日」「霜降月第十二日」
      check:
        - 主角睡下又醒来、或剧情明确跨过一整天才更新，一天之内保持不变
    时段:
      format: 清晨 / 上午 / 下午 / 夜晚
      check:
        - 随剧情推进更新；主角睡下时改成「夜晚」，醒来时改成「清晨」
    地点:
      check:
        - 主角移动时更新为当前所在地点

  主角:
    姓名:
      check:
        - 开局确定后不再改动
    执业等级:
      type: "'F' | 'E' | 'D' | 'C' | 'B' | 'A' | 'S'"
      check:
        - 只有剧情里明确写出晋升，才提升一档，一次最多一档
        - 没有剧情支撑时不允许提升
    精神力:
      type: number
      range: 0 ~ 精神力上限
      check:
        - 每完成一次精神疏导，扣减「治疗.{哨兵姓名}.线数 + 治疗.{哨兵姓名}.失误次数」
        - 主角睡觉醒来后回满
        - 不因其他琐事增减
    精神力上限:
      type: number
      check:
        - 只在执业等级提升时同步增加
    金钱:
      type: number
      check:
        - 接诊结算时按 今日.申请列表.{哨兵姓名}.诊金 增加
        - 升级诊所设施时扣减

  诊所:
    名称:
      check:
        - 由主角取名，确定后不再改动
    名声:
      type: number
      range: 0 ~ 100
      check:
        - 每次接诊结算后按评级加分，评级越高加得越多
        - 攒到 100 时：名声清零、星级 +1，并在正文里写出诊所升格的场面
    星级:
      type: number
      range: 1 ~ 5
      check:
        - 只由名声攒满 100 触发，不单独增减
    诊室等级:
      type: number
      check:
        - 只有主角花钱升级时 +1
        - 等级越高，每天能接的申请越多
    躺椅等级:
      type: number
      check:
        - 只有主角花钱升级时 +1
        - 等级越高，每次疏导的起始舒适度越高，前几次失误不计精神力

  今日:
    申请列表:
      type: |-
        {
          [哨兵姓名: string]: {
            等级: 'F' | 'E' | 'D' | 'C' | 'B' | 'A' | 'S';
            污染度: number;
            战损来源: string;
            诊金: number;
            状态: '待接' | '已接' | '已婉拒';
          }
        }
      check:
        - 日期变更时整体清空，重新生成 3~6 名申请者
        - 申请者的等级不超过当前星级解锁的上限
        - 主角接下某人时把该人 状态 改成「已接」，婉拒时改成「已婉拒」
        - 状态不是「待接」的人不要再出现在正文的申请描写里

  哨兵:
    哨兵.${哨兵姓名}:
      type: |-
        {
          等级: 'F' | 'E' | 'D' | 'C' | 'B' | 'A' | 'S';
          污染度: number;
          战损来源: string;
          信赖: number;
          好感: number;
          状态: '在诊' | '已出院' | '已收编';
        }
      check:
        - 某人第一次出现在申请列表时新建记录，污染度取自当次申请
        - 信赖：每次疏导后按本次表现增减，范围 0~100，跨场累积，出院不清零
        - 好感：只在剧情里主角与哨兵有明确情感互动时增加，范围 0~100，单次最多 +3
        - 污染度：疏导完成后大幅下降，平时随时间缓慢回升
        - 出院时把 状态 改成「已出院」，收编时改成「已收编」，不要删除记录

  治疗:
    治疗.${哨兵姓名}:
      type: |-
        {
          线数: number;
          已完成: number;
          失误次数: number;
          失误日志: { [失误序号: string]: string };
          评级: string;
        }
      check:
        - 这些字段由界面小游戏实时写入，你在结算时只读不写
        - 唯一例外：本次疏导结算完成后，把整条 治疗.{哨兵姓名} 删除
