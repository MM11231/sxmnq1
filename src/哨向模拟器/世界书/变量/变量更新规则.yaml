---
# ============================================================
#  谁写什么
# ============================================================
#
# 这张卡有两套系统在写同一份变量:
#
#   【界面】诊疗界面里的小游戏。玩家点「接诊」→ 玩一局 → 点结算。
#          线数、失误、评级、精神力消耗、诊金、名声、信赖、污染度
#          全部由它按固定公式算好直接写进变量, 再发一条元指令让你写剧情。
#
#   【你】   写剧情的那一方。负责一切需要判断和文笔的东西:
#          时间推进、造人、好感、叙事性的状态变化。
#
# 纪律只有一条: **算得出来的数字, 你一个都不要碰。**
# 精神力、金钱、名声、星级、信赖、污染度这几项如果你也去加减,
# 就会和界面重复记账, 玩家会看到诊金翻倍、精神力突然掉光。
# 见到它们变了, 那是界面写的, 你只负责把它写成身体感受和情绪。
#
# 下面每条都标了【界面】还是【你】。
# ============================================================

变量更新规则:
  世界:
    日期:
      format: 「{月}{日}」，如「霜降月第一日」「霜降月第十二日」
      check:
        - 【你】主角睡下又醒来、或剧情明确跨过一整天才更新，一天之内保持不变
    时段:
      format: 清晨 / 上午 / 下午 / 夜晚
      check:
        - 【你】随剧情推进更新；主角睡下时改成「夜晚」，醒来时改成「清晨」
    地点:
      check:
        - 【你】主角移动时更新为当前所在地点

  主角:
    姓名:
      check:
        - 【你】开局确定后不再改动
    执业等级:
      type: "'F' | 'E' | 'D' | 'C' | 'B' | 'A' | 'S'"
      check:
        - 【你】只有剧情里明确写出晋升，才提升一档，一次最多一档
        - 【你】没有剧情支撑时不允许提升
    精神力:
      type: number
      range: 0 ~ 精神力上限
      check:
        - 【界面】每次疏导结束按小游戏结果扣减，你**不要**再扣一次
        - 【你】唯一允许写它的场合：主角睡下又醒来时，改成 精神力上限。除此之外一个字都别动
    精神力上限:
      type: number
      check:
        - 【你】只在执业等级提升时同步增加，不要因为别的原因涨
    金钱:
      type: number
      check:
        - 【界面】接诊结算时自动增加，你不要再记一次
        - 【你】唯一允许写它的场合：主角掏钱升级诊所设施时扣减升级费用

  诊所:
    名称:
      check:
        - 【你】由主角取名，确定后不再改动
    名声:
      type: number
      range: 0 ~ 100
      check:
        - 【界面】每次接诊结算后按评级加分，攒到 100 时自动清零并让星级 +1
        - 【你】完全不要写这个字段。诊所有多出名，写进正文的描写里，别写进数字里
    星级:
      type: number
      range: 1 ~ 5
      check:
        - 【界面】只由名声攒满 100 触发
        - 【你】完全不要写这个字段；星级升了说明名声刚攒满，正文里写出诊所升格的场面
    诊室等级:
      type: number
      check:
        - 【你】只在主角花钱升级时 +1，升级费用从 金钱 里扣
        - 等级越高，每天能接的申请越多
    躺椅等级:
      type: number
      check:
        - 【你】只在主角花钱升级时 +1，升级费用从 金钱 里扣
        - 等级越高，每次疏导的起始舒适度越高，前几次失误不计精神力

  今日:
    申请列表:
      type: |-
        {
          [哨兵姓名: string]: {
            等级: 'F' | 'E' | 'D' | 'C' | 'B' | 'A' | 'S';
            污染度: number;
            战损来源: string;
            诊金: number;
            状态: '待接' | '已接' | '已婉拒';
          }
        }
      check:
        - 【你】日期变更时整体清空，重新生成 3~6 名申请者，状态一律写「待接」
        - 【你】申请者的等级不超过当前星级解锁的上限
        - 【你】诊金按申请者的等级和污染度给个合理数目，这是基础诊金，结算时界面会按评级乘系数
        - 【你】战损来源要写成具体的事件，例如「清剿三号污染区时被精神体撕开防线」，不要写「战斗受伤」这种空话
        - 【你】主角在正文里明确把人打发走时，把 状态 改成「已婉拒」
        - 【你】不要写「已接」—— 那是玩家在界面上点「接诊」时写的
        - 状态不是「待接」的人不要再出现在正文的申请描写里
        - 回头客再次出现时，污染度按他这段时间的经历重新给，不要照抄上次的值

  哨兵:
    哨兵.${哨兵姓名}:
      type: |-
        {
          等级: 'F' | 'E' | 'D' | 'C' | 'B' | 'A' | 'S';
          污染度: number;
          战损来源: string;
          信赖: number;
          好感: number;
          状态: '在诊' | '已出院' | '已收编';
        }
      check:
        - 【你】把某人写进 今日.申请列表 时，若 哨兵 里还没有他，同时在这里建一条记录：
          等级 和 战损来源 照抄申请，污染度 取本次申请的值，信赖 和 好感 都从 0 开始，状态 写「在诊」
        - 【你】回头客沿用已有的记录，不要重建、不要把信赖和好感清零
        - 信赖：范围 0~100，【界面】每次疏导后按评级自动增加；你只读不写
        - 好感：范围 0~100，【你】独占这个字段 —— 只在剧情里主角与哨兵有明确情感互动时增加，
          单次最多 +3。没有互动就不涨。这是这张卡唯一由你判断的亲密度
        - 污染度：【界面】在疏导结算时降低；你只在把该哨兵写进新一天的申请列表时按他的经历重写
        - 状态：【界面】在污染度降到 0 时改成「已出院」；【你】在剧情收编了某人时改成「已收编」。
          任何情况下都不要删除记录 —— 出院和收编都是关系的延续，不是关系的结束
