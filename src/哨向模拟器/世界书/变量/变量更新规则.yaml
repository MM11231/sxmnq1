---
# ============================================================
#  谁写什么
# ============================================================
#
# 这张卡有两套系统在写同一份变量:
#
#   【界面】诊疗界面里的小游戏。玩家点「接诊」→ 玩一局 → 点结算。
#          线数、失误、评级、精神力消耗、诊金、名声、信赖、污染度
#          全部由它按固定公式算好直接写进变量, 再发一条元指令让你写剧情。
#
#   【你】   写剧情的那一方。负责一切需要判断和文笔的东西:
#          时间推进、给待登记的申请者起名、好感、叙事性的状态变化。
#
# 纪律只有一条: **算得出来的数字, 你一个都不要碰。**
# 精神力、精神力上限、金钱、名声、等级、气氛、家具、信赖、污染度、已治疗,
# 还有 今日 下面那一整套申请者 —— 全都是界面掷定和结算的。
# 你要是也去加减, 就会和界面重复记账, 玩家会看到诊金翻倍、精神力突然掉光。
# 见到它们变了, 那是界面写的, 你只负责把它写成身体感受和情绪。
#
# **你独占的字段只有这些**: NPC 的 姓名 与 战损来源 (写在 今日.待登记 里)、
# 好感、世界.日期/时段/地点, 以及一切文本。
#
# 下面每条都标了【界面】还是【你】。
# ============================================================

变量更新规则:
  世界:
    日期:
      format: 「{月}{日}」，如「霜降月第一日」「霜降月第十二日」
      check:
        - 【你】主角睡下又醒来、或剧情明确跨过一整天才更新，一天之内保持不变
    时段:
      format: 清晨 / 上午 / 下午 / 夜晚
      check:
        - 【你】随剧情推进更新；主角睡下时改成「夜晚」，醒来时改成「清晨」
    地点:
      check:
        - 【你】主角移动时更新为当前所在地点

  主角:
    姓名:
      check:
        - 【你】开局确定后不再改动
    精神力:
      type: number
      range: 0 ~ 精神力上限
      check:
        - 【界面】每次疏导结束按小游戏结果扣减，你**不要**再扣一次
        - 【你】唯一允许写它的场合：主角睡下又醒来时，改成 精神力上限。除此之外一个字都别动
    精神力上限:
      type: number
      check:
        - 【界面】由 诊所.等级 决定（D 100 / C 120 / B 140 / A 160 / S 180），升级时自动变
        - 【你】完全不要写这个字段
    金钱:
      type: number
      check:
        - 【界面】接诊结算时自动增加；主角买家具时自动扣减
        - 【你】完全不要写这个字段。花钱与进账都写在正文的描写里，别写进数字里

  诊所:
    名称:
      check:
        - 【你】由主角取名，确定后不再改动
    等级:
      type: "'D' | 'C' | 'B' | 'A' | 'S'"
      check:
        - 【界面】只由名声攒满 100 触发进位，一次一档
        - 【你】完全不要写这个字段；等级升了说明名声刚攒满，正文里写出诊所升格的场面
    名声:
      type: number
      range: 0 ~ 100
      check:
        - 【界面】每次接诊结算后按评级加分，攒到 100 时自动清零并让等级进位一档
        - 【你】完全不要写这个字段。诊所有多出名，写进正文的描写里，别写进数字里
    气氛:
      type: number
      check:
        - 【界面】由已摆放的家具算出来的（每件家具的氛围加起来）。**它不是能直接改的数**，
          想让它变只有一条路：去「家园」里买家具、换更好的床
        - 【你】完全不要写这个字段。诊所里暖不暖和，写进正文的描写里，别写进数字里
    家具:
      type: |-
        Array<{
          名称: string;          // 必须是商店里有的名字
          类型: '床' | '装饰';
          氛围: number;
          在哪: string;          // 形如 '一号·北'；空字符串 = 还在仓库没摆出来
        }>
      check:
        - 【界面】玩家在「家园」里买、摆、收，全部由它写
        - 【你】完全不要写这个字段

  今日:
    已生成于:
      type: string
      check:
        - 【界面】日期戳，用来防止同一天掷出两批申请者
        - 【你】完全不要写这个字段
    待登记:
      type: |-
        Array<{
          等级: 'D' | 'C' | 'B' | 'A' | 'S';
          污染度: number;
          诊金: number;
          年龄: number;
          地域: string;
          精神体: { 纲: string; 方向: string; 栖息: string; 体型: string; 危险: string };
          特征: string[];
          A面: string;
          B面: string;
          姓名: string;
          战损来源: string;
          字数: number;
          中式: boolean;
        }>
      check:
        - 【界面】日期变更时整体重掷 3~6 个人，数值全部由界面掷定
        - 【你】**这一块是你唯一要动手的地方，而且只能动两个字段**：
          把 `姓名` 和 `战损来源` 填进去，其余字段一个字都不要改、不要删、不要补
        - 【你】姓名必须按该条目自带的 `字数` 与 `中式` 来取：中式要极简朴素、含偏门姓氏、
          拒绝言情高频字与古风堆砌；西式要平实、避开历史名人与泛滥常见名
        - 【你】战损来源要写成具体的事件，例如「清剿三号污染区时被精神体撕开防线」，
          不要写「战斗受伤」这种空话
        - 【你】本次回复必须**把 `待登记` 里每一个人都命名完**。名字写在哪个条目里，
          那个人就是哪一个 —— 不需要逐个交代对应关系
        - 【界面】你填完之后，界面会自动把这些条目搬进 `申请列表` 并清空 `待登记`
        - 【你】不要自己去写 `申请列表`，也不要清空 `待登记`
    申请列表:
      type: |-
        {
          [哨兵姓名: string]: {
            等级: 'D' | 'C' | 'B' | 'A' | 'S';
            污染度: number; 诊金: number; 年龄: number; 地域: string;
            精神体: { 纲: string; 方向: string; 栖息: string; 体型: string; 危险: string };
            特征: string[]; A面: string; B面: string; 战损来源: string;
            状态: '待接' | '已接' | '已婉拒';
          }
        }
      check:
        - 【界面】由 `待登记` 自动搬进来，等级/污染度/诊金 全部是掷定的，不要改
        - 【你】主角在正文里明确把人打发走时，把 状态 改成「已婉拒」
        - 【你】不要写「已接」—— 那是玩家在界面上点「接诊」时写的
        - 状态不是「待接」的人不要再出现在正文的申请描写里

  哨兵:
    哨兵.${哨兵姓名}:
      type: |-
        {
          等级: 'D' | 'C' | 'B' | 'A' | 'S';
          污染度: number; 诊金: number; 年龄: number; 地域: string;
          精神体: { 纲: string; 方向: string; 栖息: string; 体型: string; 危险: string };
          特征: string[]; A面: string; B面: string; 战损来源: string;
          信赖: number; 好感: number; 已治疗: number;
          状态: '在诊' | '已出院' | '已收编';
        }
      check:
        - 【界面】这个人被接诊后由界面建档，档案字段全部照搬申请列表
        - 【你】完全不要新建、不要删除 `哨兵` 下的记录。出院和收编都是关系的延续，不是关系的结束
        - 信赖：范围 0~100，【界面】每次疏导后按评级自动增加；你只读不写
        - 好感：范围 0~100，【你】独占这个字段 —— 只在剧情里主角与哨兵有明确情感互动时增加，
          单次最多 +3。没有互动就不涨。这是这张卡唯一由你判断的亲密度
        - 污染度：【界面】在疏导结算时按评级下降；你只读不写
        - 已治疗：【界面】每疏导一次 +1；你只读不写
        - 状态：【界面】在污染度降到 0 时改成「已出院」；【你】在剧情收编了某人时改成「已收编」
