---
# ============================================================
#  谁写什么
# ============================================================
#
# 这张卡有两套系统在写同一份变量:
#
#   【界面】诊疗界面里的小游戏。玩家点「接诊」→ 玩一局 → 点结算。
#          线数、失误、评级、精神力消耗、诊金、名声、信赖、污染度
#          全部由它按固定公式算好直接写进变量, 再发一条元指令让你写剧情。
#
#   【你】   写剧情的那一方。负责一切需要判断和文笔的东西:
#          时间推进、给待登记的申请者起名、好感、叙事性的状态变化。
#
# 纪律只有一条: **算得出来的数字, 你一个都不要碰。**
# 精神力、精神力上限、金钱、名声、等级、气氛、家具、信赖、污染度、已治疗,
# 还有 今日 下面那一整套申请者 —— 全都是界面掷定和结算的。
# 你要是也去加减, 就会和界面重复记账, 玩家会看到诊金翻倍、精神力突然掉光。
# 见到它们变了, 那是界面写的, 你只负责把它写成身体感受和情绪。
#
# **你独占的字段只有这些**: NPC 的 姓名 与 战损来源 (写在 今日.待登记 里)、
# 好感、`世界` 底下那一整套 (日期/时段/地点/时刻/星期/季节/天气/温度/世界主线/近期事件/报纸供稿)、
# 以及一切文本。
# 两个例外, 都是**玩家在界面上自己弄出来的**, 你一个字都别写:
# `世界.报纸投稿` (玩家掏钱买的版面) 和 `世界.占卜` (玩家自己翻的牌)。
#
# 下面每条都标了【界面】还是【你】。
# ============================================================

变量更新规则:
  世界:
    日期:
      format: 「{月}{日}」，如「霜降月第一日」「霜降月第十二日」
      check:
        - 【你】主角睡下又醒来、或剧情明确跨过一整天才更新，一天之内保持不变
    时段:
      format: 清晨 / 上午 / 下午 / 夜晚
      check:
        - 【你】随剧情推进更新；主角睡下时改成「夜晚」，醒来时改成「清晨」
    地点:
      check:
        - 【你】主角移动时更新为当前所在地点
    时刻:
      format: 24 小时制「HH:MM」，如「07:30」「21:05」
      check:
        - 【你】随剧情推进更新。它和 `时段` 说的是同一件事的两个精度，别让两边打架
    星期:
      format: 星期一 ~ 星期日
      check:
        - 【你】`日期` 跨天时跟着往后推一天；一天之内保持不变
    季节:
      format: 春 / 夏 / 秋 / 冬
      check:
        - 【你】跟着 `日期` 所在的月份走, 不是逐日会变的东西
    天气:
      format: 晴 / 多云 / 阴 / 雾 / 雨 / 雪 / 沙尘, 两到四个字
      check:
        - 【你】写主角此刻身处之地的室外天气。可以随剧情变, 但一天之内别反复横跳
    温度:
      format: 两到四个字的体感, 如「偏冷」「闷热」「刺骨」
      check:
        - 【你】跟着 `季节` 与 `天气` 走。**不要写具体度数** —— 这个世界的人报的是体感
    世界主线:
      format: 一句话, 三十字以内
      check:
        - 【你】写的是**这个世界正在发生的大事**, 不是主角的日常, 更不是诊所的经营。
          像「霜降月初，各大军区开始向极北集中伤员」；不要写「主角今天接待了几个人」
        - 【你】没有变化就别动它 —— 一条主线挂很多天是正常的
    近期事件:
      type: |-
        Array<{
          名称: string;   // 哪个势力/哪个地方
          状态: string;   // 如「进行中」「已平息」「待观察」
          说明: string;   // 一句话
        }>
      check:
        - 【你】平行发生的世界动静, 保持两三条就够, 界面只留最近五条
        - 【你】**不要往里写主角或诊所**。这一栏存在的意义就是让玩家看见世界不围着主角转；
          写成主角的功绩簿就全毁了
        - 【你】追加新条目用 append（path 写 `/世界/近期事件/-`），不要整段重写；
          某件事平息了就把那条的 `状态` 改掉, 不要删
    报纸供稿:
      type: |-
        Array<{
          日期: string;   // 必须与 世界.日期 逐字相同
          标题: string;   // 一行, 像报纸的标题
          正文: string;   // 两三句, 把话说完就停
        }>
      check:
        - 【你】**可选, 不写完全没问题**。不写的时候头版会自动用氛围内容补上, 报纸不会空
        - 【你】写的必须是**这个世界正在发生的事**：四大特区的政治、航线、物价、边防、
          深渊、黑市。跟当下剧情有没有关系都可以
        - 【你】**不要写主角和诊所**。报纸不围着主角转, 开局的小诊所更不该上头版 ——
          那读起来像是硬夸。唯一的例外：`诊所.名声` 已经到 70 以上, 并且这一楼确实
          发生了值得上报的大事, 那时才可以写一条, 而且要写成旁人视角的新闻, 不是贺词
        - 【你】追加用 append（path 写 `/世界/报纸供稿/-`）, 一期限一条, 最多两条；
          日期对不上的旧稿界面不会显示, 所以不用你清理
    报纸投稿:
      type: |-
        Array<{
          日期: string;
          版面: '宣传' | '要闻' | '社会' | '经济' | '讣告' | '广告';
          标题: string;
          正文: string;
          署名: string;
        }>
      check:
        - 【界面】玩家在「世界」页自己写、自己掏钱买的版面。**花钱是这里的全部意义**
        - 【你】完全不要写这个字段。不要替玩家写广告, 也不要因为玩家投稿了就加名声 ——
          名声由界面按版面算好直接写进去, 你再加一次就是重复记账
        - 【你】可以做的是：在正文里把这件事写成场面 —— 报纸印出来、传开、
          有人照着地址找过来。写得含蓄一点, 别写成庆功
    占卜:
      type: |-
        {
          已抽于: string;  // 日期戳, 与 世界.日期 相等就表示今天已经抽过
          牌:     string;  // 大阿卡纳的牌名, 如「塔」「月亮」
          逆位:   boolean;
          解读:   string;  // 牌义 × 当日局势, 一整段话
        }
      check:
        - 【界面】玩家在「世界」页点「占卜」翻出来的。**你完全不要写这个字段**, 四个子字段都不要碰
        - 【你】不要替玩家抽牌, 不要改解读, 也不要在正文里替这一卦下结论 ——
          牌是玩家自己翻的, 你抢着解就把那次翻牌作废了
        - 【你】可以做的是：如果玩家在正文里提到自己去占卜了, 由你写出他翻牌时的场面。
          但牌面与解读以变量里已经存着的那一份为准, 不要另编一张

  主角:
    姓名:
      check:
        - 【你】开局确定后不再改动
    精神力:
      type: number
      range: 0 ~ 精神力上限
      check:
        - 【界面】每次疏导结束按小游戏结果扣减，你**不要**再扣一次
        - 【你】唯一允许写它的场合：主角睡下又醒来时，改成 精神力上限。除此之外一个字都别动
    精神力上限:
      type: number
      check:
        - 【界面】由 诊所.等级 决定（D 100 / C 120 / B 140 / A 160 / S 180），升级时自动变
        - 【你】完全不要写这个字段
    金钱:
      type: number
      check:
        - 【界面】接诊结算时自动增加；主角买家具时自动扣减
        - 【你】完全不要写这个字段。花钱与进账都写在正文的描写里，别写进数字里

  诊所:
    名称:
      check:
        - 【你】由主角取名，确定后不再改动
    等级:
      type: "'D' | 'C' | 'B' | 'A' | 'S'"
      check:
        - 【界面】只由名声攒满 100 触发进位，一次一档
        - 【你】完全不要写这个字段；等级升了说明名声刚攒满，正文里写出诊所升格的场面
    名声:
      type: number
      range: 0 ~ 100
      check:
        - 【界面】每次接诊结算后按评级加分，攒到 100 时自动清零并让等级进位一档
        - 【你】完全不要写这个字段。诊所有多出名，写进正文的描写里，别写进数字里
    气氛:
      type: number
      check:
        - 【界面】由已摆放的家具算出来的（每件家具的氛围加起来）。**它不是能直接改的数**，
          想让它变只有一条路：去「家园」里买家具、换更好的床
        - 【你】完全不要写这个字段。诊所里暖不暖和，写进正文的描写里，别写进数字里
    家具:
      type: |-
        Array<{
          名称: string;          // 必须是商店里有的名字
          类型: '床' | '装饰';
          氛围: number;
          在哪: string;          // 形如 '一号·北'；空字符串 = 还在仓库没摆出来
        }>
      check:
        - 【界面】玩家在「家园」里买、摆、收，全部由它写
        - 【你】完全不要写这个字段

  今日:
    已生成于:
      type: string
      check:
        - 【界面】日期戳，用来防止同一天掷出两批申请者
        - 【你】完全不要写这个字段
    待登记:
      type: |-
        Array<{
          等级: 'D' | 'C' | 'B' | 'A' | 'S';
          污染度: number;
          诊金: number;
          年龄: number;
          地域: string;
          精神体: { 纲: string; 方向: string; 栖息: string; 体型: string; 危险: string };
          特征: string[];
          A面: string;
          B面: string;
          姓名: string;
          战损来源: string;
          字数: number;
          中式: boolean;
        }>
      check:
        - 【界面】日期变更时整体重掷 3~6 个人，数值全部由界面掷定
        - 【你】**这一块是你唯一要动手的地方，而且只能动两个字段**：
          把 `姓名` 和 `战损来源` 填进去，其余字段一个字都不要改、不要删、不要补
        - 【你】姓名必须按该条目自带的 `字数` 与 `中式` 来取：中式要极简朴素、含偏门姓氏、
          拒绝言情高频字与古风堆砌；西式要平实、避开历史名人与泛滥常见名
        - 【你】战损来源要写成具体的事件，例如「清剿三号污染区时被精神体撕开防线」，
          不要写「战斗受伤」这种空话
        - 【你】本次回复必须**把 `待登记` 里每一个人都命名完**。名字写在哪个条目里，
          那个人就是哪一个 —— 不需要逐个交代对应关系
        - 【界面】你填完之后，界面会自动把这些条目搬进 `申请列表` 并清空 `待登记`
        - 【你】不要自己去写 `申请列表`，也不要清空 `待登记`
    申请列表:
      type: |-
        {
          [哨兵姓名: string]: {
            等级: 'D' | 'C' | 'B' | 'A' | 'S';
            污染度: number; 诊金: number; 年龄: number; 地域: string;
            精神体: { 纲: string; 方向: string; 栖息: string; 体型: string; 危险: string };
            特征: string[]; A面: string; B面: string; 战损来源: string;
            状态: '待接' | '已接' | '已婉拒';
          }
        }
      check:
        - 【界面】由 `待登记` 自动搬进来，等级/污染度/诊金 全部是掷定的，不要改
        - 【你】主角在正文里明确把人打发走时，把 状态 改成「已婉拒」
        - 【你】不要写「已接」—— 那是玩家在界面上点「接诊」时写的
        - 状态不是「待接」的人不要再出现在正文的申请描写里

  哨兵:
    哨兵.${哨兵姓名}:
      type: |-
        {
          等级: 'D' | 'C' | 'B' | 'A' | 'S';
          污染度: number; 诊金: number; 年龄: number; 地域: string;
          精神体: { 纲: string; 方向: string; 栖息: string; 体型: string; 危险: string };
          特征: string[]; A面: string; B面: string; 战损来源: string;
          信赖: number; 好感: number; 已治疗: number;
          状态: '在诊' | '已出院' | '已收编';
        }
      check:
        - 【界面】这个人被接诊后由界面建档，档案字段全部照搬申请列表
        - 【你】完全不要新建、不要删除 `哨兵` 下的记录。出院和收编都是关系的延续，不是关系的结束
        - 信赖：范围 0~100，【界面】每次疏导后按评级自动增加；你只读不写
        - 好感：范围 0~100，【你】独占这个字段 —— 只在剧情里主角与哨兵有明确情感互动时增加，
          单次最多 +3。没有互动就不涨。这是这张卡唯一由你判断的亲密度
        - 污染度：【界面】在疏导结算时按评级下降；你只读不写
        - 已治疗：【界面】每疏导一次 +1；你只读不写
        - 状态：【界面】在污染度降到 0 时改成「已出院」；【你】在剧情收编了某人时改成「已收编」
