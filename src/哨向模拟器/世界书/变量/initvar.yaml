# yaml-language-server: $schema=../../../sxmnq/schema.json
# 在编写 initvar 之前, 请先保证终端有在运行 `pnpm watch`, 这会生成 schema.json 用于检验 initvar 是否有效
世界:
  日期: 霜降月第一日
  时段: 清晨
  地点: '{{user}}的诊所'
  时刻: '07:30'
  星期: 星期一
  季节: 秋
  天气: 雾
  # 体感, 不是度数 —— 写「偏冷」比写「6℃」更像这个世界的人会说的话。
  温度: 偏冷
  # 世界主线是**世界**的事, 不是诊所的事 (spec §2.1)。开局的这句是背景板, 之后由 AI 换。
  世界主线: 霜降月初，四大特区开始向各自的边境哨站集中这一季的伤员
  近期事件: []
  # 《白塔日报》的两条口子 (第 3 期)。**必须在这里留空数组** —— 报纸本身是前端按
  # 世界.日期 现算的、不进变量, 但 AI 得先「看见」这两个字段才会去写头条:
  # 变量列表那条世界书注进提示词的是 stat_data 本身, 不是 schema。
  # 不在这儿留位, 报纸供稿就永远空着, 而界面上看起来只是「今天没有头条」。
  报纸供稿: []
  # 报纸投稿是玩家掏钱买的, 由界面写; 初值同样留空。
  报纸投稿: []
主角:
  姓名: '{{user}}'
  身份: 向导
  路线: 常规
  已创建: false
  精神力: 100
  精神力上限: 100
  金钱: 0
诊所:
  名称: 无名诊所
  等级: D
  名声: 0
  # 气氛 是派生值 (Σ 已摆放家具的氛围)。这里给个 0 只是初值, schema 每次解析都会重算。
  气氛: 0
  # 家具: 空数组 == 开局态。**必须留空** —— 存档迁移就是靠「空」认出这是新局/老存档,
  # 然后播种一张折叠床 (spec §8.1)。在这里预先摆一张会把那条路堵死。
  家具: []
今日:
  已生成于: ''
  待登记: []
  申请列表: {}
哨兵: {}
