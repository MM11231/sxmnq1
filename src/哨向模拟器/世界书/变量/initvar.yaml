# yaml-language-server: $schema=../../../sxmnq/schema.json
# 在编写 initvar 之前, 请先保证终端有在运行 `pnpm watch`, 这会生成 schema.json 用于检验 initvar 是否有效
世界:
  日期: 霜降月第一日
  时段: 清晨
  地点: '{{user}}的诊所'
主角:
  姓名: '{{user}}'
  身份: 向导
  路线: 常规
  已创建: false
  精神力: 100
  精神力上限: 100
  金钱: 0
诊所:
  名称: 无名诊所
  等级: D
  名声: 0
  # 气氛 是派生值 (Σ 已摆放家具的氛围)。这里给个 0 只是初值, schema 每次解析都会重算。
  气氛: 0
  # 家具: 空数组 == 开局态。**必须留空** —— 存档迁移就是靠「空」认出这是新局/老存档,
  # 然后播种一张折叠床 (spec §8.1)。在这里预先摆一张会把那条路堵死。
  家具: []
今日:
  已生成于: ''
  待登记: []
  申请列表: {}
哨兵: {}
